# ZOO 团本档案 — nip.io 主入口 + sslip.io 手机备用
# HTTP 与 HTTPS 都反代，不强制跳转（跨境 HTTPS 常被重置）

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zoo.150-109-97-156.nip.io;

    ssl_certificate /etc/letsencrypt/live/zoo.150-109-97-156.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zoo.150-109-97-156.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/mcp-predict-security.conf;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name zoo.150-109-97-156.nip.io;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8765;
